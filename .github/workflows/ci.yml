name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 代码质量检查（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          NODE_OPTIONS: "--no-deprecation"

      - name: Build
        run: pnpm run build

  coverage:
    name: 测试覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: skill-registry coverage
        run: pnpm --filter @yyc3/skill-registry test -- --coverage

      - name: mcp-runtime coverage
        run: pnpm --filter @yyc3/mcp-runtime test -- --coverage

      - name: agent-runtime coverage
        run: pnpm --filter @yyc3/agent-runtime test -- --coverage

      - name: conductor coverage
        run: pnpm --filter @yyc3/conductor test -- --coverage

      - name: orchestrator coverage
        run: pnpm --filter @yyc3/orchestrator test -- --coverage

      - name: plugin-marketplace coverage
        run: pnpm --filter @yyc3/plugin-marketplace test -- --coverage

      - name: skill-gateway coverage
        run: pnpm --filter @yyc3/skill-gateway test -- --coverage

      - name: skill-sandbox coverage
        run: pnpm --filter @yyc3/skill-sandbox test -- --coverage

      - name: observability coverage
        run: pnpm --filter @yyc3/observability test -- --coverage

      - name: yyc3-i18n coverage
        run: pnpm --filter @yyc3/i18n-core test --coverage -- --coverage.thresholds.branches=80

  skills-audit:
    name: 技能资产审计（validate / dedup / naming）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skills validate
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills validate

      - name: Skills naming lint（AYNC 合规报告，非阻断）
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills naming lint

      - name: Skills dedup check
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills dedup
