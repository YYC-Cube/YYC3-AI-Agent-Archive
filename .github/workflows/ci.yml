name: CI

on:
  push:
    branches: [master]
  pull_request:

# 最小权限原则：仅读取仓库内容
permissions:
  contents: read

jobs:
  quality:
    name: 代码质量检查（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  skills-audit:
    name: 技能资产审计（validate / dedup）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skills validate
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills validate

      - name: Skills naming lint（AYNC 合规报告，非阻断）
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills naming lint

      - name: Skills dedup check
        run: node packages/yyc3-cli/bin/yyc3-cli.js skills dedup
