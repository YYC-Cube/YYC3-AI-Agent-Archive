name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 优雅降级：未配置 NPM_TOKEN 时跳过发布，保持 Release 绿色
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true'
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped notice
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::notice::NPM_TOKEN 未配置，已跳过 npm 发布（验证流程正常完成）"
          echo "配置方法: repo Settings → Secrets and variables → Actions → New repository secret → NPM_TOKEN"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true