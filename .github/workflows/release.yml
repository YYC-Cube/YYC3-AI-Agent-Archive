name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 优雅降级：未配置 NPM_TOKEN 时跳过发布，保持 Release 绿色
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致，请先对齐版本再打 tag"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true'
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped notice
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::notice::NPM_TOKEN 未配置，已跳过 npm 发布（验证流程正常完成）"
          echo "配置方法: repo Settings → Secrets and variables → Actions → New repository secret → NPM_TOKEN"

  docker:
    name: Docker 构建冒烟 + 推送 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        id: images
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          {
            echo "repo_lc=${REPO_LC}"
            echo "gateway=${REGISTRY}/${REPO_LC}/skill-gateway"
            echo "mcp=${REGISTRY}/${REPO_LC}/mcp-runtime"
            echo "agent=${REGISTRY}/${REPO_LC}/agent-runtime"
            echo "tag=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Build skill-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: skill-gateway
          load: true
          tags: ${{ steps.images.outputs.gateway }}:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Build mcp-runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: mcp-runtime
          load: true
          tags: ${{ steps.images.outputs.mcp }}:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      - name: Build agent-runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent-runtime
          load: true
          tags: ${{ steps.images.outputs.agent }}:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Smoke test（compose 启动三容器 + API 冒烟）
        env:
          # 与 compose 的 image: 字段对齐，直接使用刚构建的本地镜像
          IMAGE_PREFIX: ghcr.io/${{ steps.images.outputs.repo_lc }}
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          set -e
          # agent-runtime /api 已 fail-closed 认证（P2 同构收敛）：冒烟统一注入 key
          export YYC3_API_KEYS="ci-smoke-key"
          # 用刚构建的本地镜像起服务（覆盖 compose 默认 build 行为）
          docker compose up -d --no-build
          docker compose ps

          cleanup() { docker compose down -v --timeout 10 || true; }
          trap cleanup EXIT

          # 等待三容器 healthy（最多 90s）
          for i in $(seq 1 45); do
            UNHEALTHY=$(docker compose ps --format json | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                const ps=d.trim()?JSON.parse('['+d.trim().split('\n').join(',')+']'):[];
                console.log(ps.filter(p=>p.Health!=='healthy').length);
              });")
            if [ "$UNHEALTHY" = "0" ]; then echo "✅ 三容器全部 healthy"; break; fi
            if [ "$i" = "45" ]; then echo "❌ 容器未在期限内 healthy"; docker compose logs --tail 30; exit 1; fi
            sleep 2
          done

          # API 冒烟 8 项
          assert() { # assert <描述> <期望片段> <实际响应>
            if echo "$3" | grep -q "$2"; then echo "✅ $1"; else echo "❌ $1 — got: $3"; exit 1; fi
          }
          H=$(curl -fsS http://127.0.0.1:3030/api/v1/health)
          assert "gateway health" '"ok":true' "$H"
          V=$(curl -fsS http://127.0.0.1:3030/api/v1/health/version)
          assert "gateway version" '"ok":true' "$V"
          S=$(curl -fsS http://127.0.0.1:3030/api/v1/skills)
          assert "gateway skills 列表" '"ok":true' "$S"
          R=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3030/api/v1/health/ready)
          assert "gateway ready=200" '200' "$R"
          M=$(curl -fsS http://127.0.0.1:3031/health)
          assert "mcp health" '"ok":true' "$M"
          A=$(curl -fsS http://127.0.0.1:3032/health)
          assert "agent health" '"ok":true' "$A"
          # agent /api 需认证（无凭据应被拒：401/403/503 皆证明 fail-closed 生效）
          AN=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3032/api/v1/profiles || true)
          if [ "$AN" = "200" ]; then echo "❌ agent /api 未要求认证"; exit 1; else echo "✅ agent /api fail-closed（无凭据 $AN）"; fi
          P=$(curl -fsS -H "X-API-Key: ci-smoke-key" http://127.0.0.1:3032/api/v1/profiles)
          assert "agent AI Family 档案" '"ok":true' "$P"
          C=$(curl -fsS -X POST -H "X-API-Key: ci-smoke-key" http://127.0.0.1:3032/api/v1/agents -H 'Content-Type: application/json' -d '{"profileName":"QianHang"}')
          assert "agent 创建实例" '"ok":true' "$C"

          echo "🎉 冒烟测试 9/9 全部通过"

      - name: Push images to GHCR
        run: |
          for IMG in \
            "${{ steps.images.outputs.gateway }}" \
            "${{ steps.images.outputs.mcp }}" \
            "${{ steps.images.outputs.agent }}"; do
            docker push "${IMG}:${{ steps.images.outputs.tag }}"
          done

      - name: Push latest tag
        if: "!startsWith(github.ref_name, 'v0.')"
        run: |
          for IMG in \
            "${{ steps.images.outputs.gateway }}" \
            "${{ steps.images.outputs.mcp }}" \
            "${{ steps.images.outputs.agent }}"; do
            docker tag "${IMG}:${{ steps.images.outputs.tag }}" "${IMG}:latest"
            docker push "${IMG}:latest"
          done

  baseline-advance:
    name: 评分基线随版本推进（gen-baseline + doctor GATES 同步）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout（全量历史 — 活跃度维度依赖 90 天 git log）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate baseline-v${TAG_VERSION}.json
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: node scripts/gen-baseline-v2.5.0.cjs --next "${TAG_VERSION#v}"

      - name: Point doctor GATES.baseline to new file
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          FILE="docs/skill-score/baseline-${VER}.json"
          sed -i.bak "s#baseline: 'docs/skill-score/baseline-[^']*'#baseline: '${FILE}'#" packages/yyc3-cli/lib/doctor.js && rm packages/yyc3-cli/lib/doctor.js.bak
          grep -n "baseline:" packages/yyc3-cli/lib/doctor.js | head -2

      - name: Update doctor test baseline assertion
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          FILE="docs/skill-score/baseline-${VER}.json"
          sed -i.bak "s#expect(GATES.baseline).toBe('[^']*')#expect(GATES.baseline).toBe('${FILE}')#" packages/yyc3-cli/__tests__/doctor.test.js && rm packages/yyc3-cli/__tests__/doctor.test.js.bak
          sed -i.bak "s#expect(data.version).toBe('[^']*')#expect(data.version).toBe('${VER}')#" packages/yyc3-cli/__tests__/doctor.test.js && rm packages/yyc3-cli/__tests__/doctor.test.js.bak

      - name: Create PR（人工确认合入）
        env:
          TAG_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${TAG_VERSION#v}"
          BRANCH="chore/baseline-${VER}"
          git config user.name "yyc3-bot"
          git config user.email "admin@0379.email"
          git checkout -b "$BRANCH"
          git add "docs/skill-score/baseline-${VER}.json" packages/yyc3-cli/lib/doctor.js packages/yyc3-cli/__tests__/doctor.test.js
          git commit -m "chore(baseline): advance to v${VER} — post-release quality gate baseline"
          git push origin "$BRANCH"
          gh pr create --title "chore(baseline): advance score baseline to v${VER}" \
            --body "Release v${VER} 发布后自动推进评分基线（gen-baseline + doctor GATES 同步）。合并后 doctor 门禁以新基线为准。" \
            --base main

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
