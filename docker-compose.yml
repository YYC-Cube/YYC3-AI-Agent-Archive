# ============================================================
# YYC³ AI Agent Archive — 全栈部署编排
# 服务：Skill Gateway / MCP Runtime / Agent Runtime
# 端口：3030-3039
# ============================================================

services:
  # ---- Skill Gateway API (技能网关) ----
  skill-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: skill-gateway
    image: ${IMAGE_PREFIX:-yyc3}/skill-gateway:${TAG:-local}
    user: "1001:1001"
    ports:
      - "${GATEWAY_PORT:-3030}:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - MCP_RUNTIME_URL=http://mcp-runtime:3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 认证: 逗号分隔 API Key 列表；未配置时写操作 fail-closed 拒绝
      - YYC3_API_KEYS=${YYC3_API_KEYS:-}
      # 限流: 配置后分布式共享；不可达自动降级内存模式
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - skills-data:/app/skills:ro
    depends_on:
      mcp-runtime:
        condition: service_healthy
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- MCP Runtime (MCP 运行时) ----
  mcp-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    image: ${IMAGE_PREFIX:-yyc3}/mcp-runtime:${TAG:-local}
    user: "1001:1001"
    ports:
      - "${MCP_PORT:-3031}:3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3031/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Agent Runtime (智能体运行时) ----
  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-runtime
    image: ${IMAGE_PREFIX:-yyc3}/agent-runtime:${TAG:-local}
    user: "1001:1001"
    ports:
      - "${AGENT_PORT:-3032}:3032"
    environment:
      - NODE_ENV=production
      - PORT=3032
      - GATEWAY_URL=http://skill-gateway:3030
      - MCP_RUNTIME_URL=http://mcp-runtime:3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      skill-gateway:
        condition: service_healthy
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3032/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  skills-data:

networks:
  yyc3-network:
    driver: bridge
