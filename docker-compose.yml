# ============================================================
# YYC³ AI Agent Archive — 全栈部署编排
# 服务：Skill Gateway / MCP Runtime / Agent Runtime
# 端口：3030-3039
#
# 安全基线（S0 整改，所有服务统一继承 yyc3-hardening）：
# - 非 root 运行（Dockerfile USER 1001）+ no-new-privileges
# - cap_drop ALL（放弃全部 Linux capabilities）
# - 只读根文件系统，仅 /tmp 为 noexec/nodev/nosuid tmpfs
# - 内存 512MB / 进程数 256 限额，防 fork 炸弹与内存 DoS
# - MCP/Agent 无独立认证，宿主端口仅绑 127.0.0.1（经 Gateway 或反代访问）
# 注意：进程内沙箱（@yyc3/skill-sandbox）为纵深防御的一道，
# 上述 OS 级隔离才是不可信技能执行的强安全边界。
# ============================================================

# 统一安全加固片段（YAML 锚点，各服务 <<: *yyc3-hardening 继承）
x-yyc3-hardening: &yyc3-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
  mem_limit: 512m
  pids_limit: 256

services:
  # ---- Skill Gateway API (技能网关，唯一对外边缘服务) ----
  skill-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: skill-gateway
    image: ${IMAGE_PREFIX:-yyc3}/skill-gateway:${TAG:-local}
    user: "1001:1001"
    <<: *yyc3-hardening
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-3030}:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - MCP_RUNTIME_URL=http://mcp-runtime:3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 认证: 逗号分隔 API Key 列表；未配置时写操作 fail-closed 拒绝
      - YYC3_API_KEYS=${YYC3_API_KEYS:-}
      # 限流: 配置后分布式共享；不可达自动降级内存模式
      - REDIS_URL=${REDIS_URL:-}
    # Task I2: 默认使用镜像内置技能快照（/app/skills，仅 SKILL.md ~4.4MB）；
    # 注入外部技能: docker compose -f docker-compose.yml -f docker-compose.skills.yml up
    # （docker-compose.skills.yml 挂载 skills-data 卷覆盖内置快照）
    depends_on:
      mcp-runtime:
        condition: service_healthy
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- MCP Runtime (MCP 运行时，无独立认证：不直接暴露局域网) ----
  mcp-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    image: ${IMAGE_PREFIX:-yyc3}/mcp-runtime:${TAG:-local}
    user: "1001:1001"
    <<: *yyc3-hardening
    ports:
      # 仅绑回环：宿主外不可达；容器间经 yyc3-network 互访
      - "127.0.0.1:${MCP_PORT:-3031}:3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3031/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Agent Runtime (智能体运行时，无独立认证：不直接暴露局域网) ----
  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-runtime
    image: ${IMAGE_PREFIX:-yyc3}/agent-runtime:${TAG:-local}
    user: "1001:1001"
    <<: *yyc3-hardening
    ports:
      # 仅绑回环：宿主外不可达；容器间经 yyc3-network 互访
      - "127.0.0.1:${AGENT_PORT:-3032}:3032"
    environment:
      - NODE_ENV=production
      - PORT=3032
      - GATEWAY_URL=http://skill-gateway:3030
      - MCP_RUNTIME_URL=http://mcp-runtime:3031
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      skill-gateway:
        condition: service_healthy
    networks:
      - yyc3-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3032/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  skills-data:

networks:
  yyc3-network:
    driver: bridge
