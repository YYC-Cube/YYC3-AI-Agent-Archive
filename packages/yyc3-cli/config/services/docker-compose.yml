version: '3.8'
services:
  # 应用服务（非root运行）- 团队yyc3
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000" # 非root用户运行（权限管控）
    ports:
      - "3200:3200"
    env_file:
      - .env.docker
      - .env.permissions
    volumes:
      - ./src:/app/src:ro # 业务目录仅读（权限限制）
    depends_on:
      - mcp-service
    networks:
      - yyc3-network
    restart: unless-stopped

  # MCP智能协同服务 - 团队yyc3
  mcp-service:
    image: mcp-smart-code:latest
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    volumes:
      - ./mcp.config.js:/app/mcp.config.js:ro
    networks:
      - yyc3-network

networks:
  yyc3-network:
    driver: bridge
